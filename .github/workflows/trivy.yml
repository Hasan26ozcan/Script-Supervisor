name: Trivy — security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-filesystem:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  trivy-docker:
    runs-on: ubuntu-latest
    needs: trivy-filesystem
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t script-supervisor:latest .

      - name: Run Trivy Docker scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: script-supervisor:latest
          format: sarif
          output: trivy-docker-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy Docker results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-docker-results.sarif
