name: Trivy — container image vulnerability scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t creative-harness:ci .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'creative-harness:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
