services:
  harness:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HARNESS_MOCK_MODE=${HARNESS_MOCK_MODE:-1}
      - HARNESS_ANTHROPIC_API_KEY=${HARNESS_ANTHROPIC_API_KEY:-}
      - HARNESS_LANGFUSE_ENABLED=${HARNESS_LANGFUSE_ENABLED:-false}
      - HARNESS_LANGFUSE_HOST=http://langfuse:3000
      - HARNESS_DATABASE_URL=${HARNESS_DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/creative_harness}
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as r, sys; sys.exit(0 if r.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["default"]

  # Optional local observability stack (Phase 7+). Langfuse is MIT-licensed
  # and self-hostable, which matters here since trace data can contain
  # unpublished creative briefs / client material.
  #
  # This is the *minimal* single-container Langfuse quickstart image, not
  # the full production compose (which additionally wants ClickHouse,
  # Postgres, Redis, and S3-compatible storage as separate services --
  # see https://langfuse.com/self-hosting for the full stack when trace
  # volume actually justifies it).
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=dev-only-change-me
      - SALT=dev-only-change-me
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
    depends_on:
      - langfuse-db
    profiles: ["observability"]

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=creative_harness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["default"]

  langfuse-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    profiles: ["observability"]

volumes:
  pgdata:
  langfuse-db-data:
