[project]
name = "creative-harness"
version = "0.1.0"
description = "A harness for creative-output generation: correction loops, vision-grounded critique, live rubrics, and cost-aware model routing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
training = [
    # Phase 9/10 only -- kept optional so `pip install .` for the API
    # server doesn't drag in a multi-GB torch/CUDA stack.
    "trl>=1.0",
    "peft>=0.13",
    "transformers>=4.45",
    "accelerate>=1.0",
    "datasets>=3.0",
    "bitsandbytes>=0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
