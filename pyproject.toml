[project]
name = "creative-harness"
version = "0.1.0"
description = "A harness for creative-output generation: correction loops, vision-grounded critique, live rubrics, and cost-aware model routing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.30",
    "scipy>=1.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.0",
    "pre-commit>=4.5",
    "pip-audit>=2.4.1,<3.0",
    "httpx2>=0.29",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "seaborn>=0.13",
    "evaluate>=0.4",
]
training = [
    # Phase 9/10 only -- kept optional so `pip install .` for the API
    # server doesn't drag in a multi-GB torch/CUDA stack.
    "trl>=1.0",
    "peft>=0.13",
    "transformers>=4.45",
    "accelerate>=1.0",
    "datasets>=3.0",
    "bitsandbytes>=0.44",
]
eval = [
    # Modern LLM eval harness, used by Anthropic/DeepMind/UK AISI. Optional
    # so the core API server doesn't need it. See evals/inspect_preference_task.py.
    "inspect-ai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
